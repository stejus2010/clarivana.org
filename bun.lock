name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # bun.lock pins packages to Lovable's private npm mirror, which GitHub can't reach.
      # Dropping it makes bun install from the public npm registry instead.
      - run: rm -f bun.lock && bun install
      - name: Build static site
        run: bunx vite build -c vite.pages.config.ts
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
      - name: SPA fallback + disable Jekyll
        run: |
          cp .output/public/index.html .output/public/404.html
          touch .output/public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
